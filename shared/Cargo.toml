[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
chrono = { version = "0.4.41", features = ["serde"] }
derive_builder = { version = "0.20.2", features = ["clippy"] }
redis = { version = "0.32.0", features = ["tokio-comp"] }
serde = "1.0.219"
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "macros", "chrono", "migrate", "uuid"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["serde", "v4"] }

name: careerbot

services:
  job-ingestor:
    build:
      context: .
      dockerfile: job-ingestor/Dockerfile
      args:
        - RUST_IMAGE=${RUST_IMAGE}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RUST_LOG=${RUST_LOG}
    image: ${IMAGE_TAG_PREFIX}-job-ingestor

  notifier:
    build:
      context: .
      dockerfile: notifier/Dockerfile
      args:
        - RUST_IMAGE=${RUST_IMAGE}
    environment:
      - RUST_LOG=${RUST_LOG}
    image: ${IMAGE_TAG_PREFIX}-notifier

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      args:
        - RUST_IMAGE=${RUST_IMAGE}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RUST_LOG=${RUST_LOG}
    image: ${IMAGE_TAG_PREFIX}-api

  postgres:
    image: postgres:17
    container_name: careerbot-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:


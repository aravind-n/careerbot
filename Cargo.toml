[workspace]
resolver = "3"
members = ["careerbot-core", "careerbot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/aravind-n/careerbot"
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["jobs", "agent", "daemon"]

[workspace.dependencies]
careerbot-core = { path = "careerbot-core" }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Library-style docs lints — careerbot is a single-user app, not a
# published library API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

# Bounded numeric casts (SQLite binds, token counts, etc.) are
# intentional and the values fit. Re-enable per-site if a concrete
# overflow risk shows up.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

[package]
name = "ingestor"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
futures = "0.3.31"
serde_json = "1.0.140"
shared = { path = "../shared" }
tokio = { version = "1.45.1", features = ["full"] }
reqwest = { version = "0.12.20", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }
chrono = "0.4.41"
serde = { version = "1.0.219", features = ["derive"] }
tracing = "0.1.41"
dotenvy = "0.15.7"
